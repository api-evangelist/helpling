aid: helpling
name: Helpling
description: >-
  Helpling is an online marketplace that connects households with vetted,
  insured independent cleaners for on-demand and recurring home-cleaning
  services. Founded in Berlin and operating across 200+ cities in Germany and
  other European markets, the platform lets customers compare cleaner profiles
  and ratings, book and reschedule appointments, and pay online, with liability
  insurance covering each booking. Helpling operates as a consumer-facing web
  and mobile app product (iOS and Android) plus separate provider and agency
  portals; it does not currently publish a public developer API, SDKs, or API
  documentation. It was surfaced through the point-nine venture portfolio and
  added to the API Evangelist network as a company profile.
